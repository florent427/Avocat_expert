# Mises à jour proposées (jamais fusionnées automatiquement) ; délai de
# 14 jours après publication, cohérent avec la politique d'approvisionnement.
# Les versions majeures ne sont pas proposées automatiquement : elles sont
# planifiées au backlog (INFRA-09) avec lecture des notes de rupture. Les mises
# à jour de sécurité ne sont concernées ni par ce filtre ni par le délai.
# Images Docker : le registre ne fournit pas de date de publication, le délai
# ne s'applique donc pas ; la revue humaine reste le seul garde-fou.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 14 }
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
  - package-ecosystem: npm
    directory: /apps/web
    schedule: { interval: weekly }
    cooldown: { default-days: 14 }
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
  - package-ecosystem: cargo
    directory: /engine
    schedule: { interval: weekly }
    cooldown: { default-days: 14 }
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
  - package-ecosystem: uv
    directory: /services/api
    schedule: { interval: weekly }
    cooldown: { default-days: 14 }
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
  - package-ecosystem: docker
    directories: [/services/api, /apps/web]
    schedule: { interval: weekly }
    cooldown: { default-days: 14 }
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
  - package-ecosystem: terraform
    directory: /infra/terraform/envs/staging
    schedule: { interval: weekly }
    cooldown: { default-days: 14 }
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
