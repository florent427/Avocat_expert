# Mises à jour proposées (jamais fusionnées automatiquement) ; délai de
# 14 jours après publication, cohérent avec la politique d'approvisionnement.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 14 }
  - package-ecosystem: npm
    directory: /apps/web
    schedule: { interval: weekly }
    cooldown: { default-days: 14 }
  - package-ecosystem: cargo
    directory: /engine
    schedule: { interval: weekly }
    cooldown: { default-days: 14 }
  - package-ecosystem: uv
    directory: /services/api
    schedule: { interval: weekly }
    cooldown: { default-days: 14 }
  - package-ecosystem: docker
    directories: [/services/api, /apps/web]
    schedule: { interval: weekly }
    cooldown: { default-days: 14 }
  - package-ecosystem: terraform
    directory: /infra/terraform/envs/staging
    schedule: { interval: weekly }
    cooldown: { default-days: 14 }
