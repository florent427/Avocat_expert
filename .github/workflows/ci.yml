name: CI

on:
  push:
    branches: ["main", "ccr-*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Moteur Rust (lexverif)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Formatage
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --locked

  backend:
    name: Backend Python (API, ingestion, recherche)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: mirror.gcr.io/pgvector/pgvector:0.8.7-pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
        env:
          POSTGRES_PASSWORD: ci-only-not-a-secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      opensearch:
        image: mirror.gcr.io/opensearchproject/opensearch:3.9.0@sha256:adfa61f85025d06b4aeb562e7e74fde7e31c437039c93c3862c17e9acebd6c7c
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          DISABLE_INSTALL_DEMO_CONFIG: "true"
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
          cluster.routing.allocation.disk.threshold_enabled: "false"
        ports: ["9200:9200"]
        options: >-
          --health-cmd "curl -sf 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s'"
          --health-interval 10s --health-timeout 10s --health-retries 30
    env:
      AVX_TEST_DATABASE_URL: postgresql://postgres:ci-only-not-a-secret@localhost:5432/postgres
      AVX_TEST_OPENSEARCH_URL: http://localhost:9200
      AVX_TEST_EMBEDDING_MODEL_DIR: ${{ github.workspace }}/.avx-models/multilingual-e5-base@d1287505
      LEXVERIF_BIN: ${{ github.workspace }}/engine/target/debug/lexverif
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Construction de lexverif
        working-directory: engine
        run: cargo build --locked
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Dépendances
        working-directory: services/api
        run: uv sync --locked
      - name: Modèle d'embeddings (cache)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.AVX_TEST_EMBEDDING_MODEL_DIR }}
          key: embedding-multilingual-e5-base@d1287505
      - name: Modèle d'embeddings (téléchargement si absent, empreintes vérifiées)
        working-directory: services/api
        run: uv run avx telecharger-modele --modele multilingual-e5-base@d1287505 --dossier "$AVX_TEST_EMBEDDING_MODEL_DIR"
      - name: Lint et formatage
        working-directory: services/api
        run: |
          uv run ruff check src tests scripts
          uv run ruff format --check src tests scripts
      - name: Typage
        working-directory: services/api
        run: uv run mypy
      - name: Schémas des contrats à jour
        working-directory: services/api
        run: uv run python scripts/export_schemas.py --check
      - name: Tests (PostgreSQL, OpenSearch, modèle d'embeddings et moteur Rust réels ; aucun test ignoré toléré)
        working-directory: services/api
        run: |
          uv run pytest -rs | tee pytest.log
          ! grep -q "SKIPPED" pytest.log

  web:
    name: Application web
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Audit des dépendances
        run: npm audit --audit-level=high
      - name: Types des contrats à jour
        run: npm run contracts:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Navigateur des tests de bout en bout
        run: npx playwright install --with-deps chromium
      - name: Tests de bout en bout (mobile et ordinateur)
        run: npm run test:e2e

  terraform:
    name: Terraform (validation, sans apply)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.7
      - run: terraform fmt -recursive -check
      - working-directory: infra/terraform/envs/staging
        run: |
          terraform init -backend=false -input=false
          terraform validate
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Analyse de sécurité (checkov ; exceptions motivées dans le code)
        run: uvx --python 3.12 checkov==3.3.26 -d . --framework terraform --quiet --compact

  images:
    name: Images (construction, vulnérabilités, SBOM, test de fumée)
    runs-on: ubuntu-24.04
    env:
      TRIVY_VERSION: 0.75.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Miroir Docker Hub (mirror.gcr.io)
        # Docker Hub et la galerie ECR publique limitent les téléchargements
        # anonymes des runners partagés ; les empreintes épinglées garantissent
        # que le miroir sert exactement les mêmes images.
        run: |
          conf=/etc/docker/daemon.json
          current="$(sudo cat "$conf" 2>/dev/null || echo '{}')"
          echo "$current" | jq '. + {"registry-mirrors": ["https://mirror.gcr.io"]}' | sudo tee "$conf" >/dev/null
          sudo systemctl restart docker
          docker info --format '{{json .RegistryConfig.Mirrors}}' | grep -q mirror.gcr.io
      - name: Construction
        run: |
          docker build -f services/api/Dockerfile -t avocat-expert/api:dev .
          docker build -t avocat-expert/web:dev apps/web
          # Canal sémantique : environnement d'exécution ONNX chargeable dans l'image.
          docker run --rm --entrypoint python avocat-expert/api:dev -c "import onnxruntime, tokenizers, numpy"
      - name: Trivy
        run: |
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          curl -sSfL -o "$archive" "$base/$archive"
          curl -sSfL -o trivy-checksums.txt "$base/trivy_${TRIVY_VERSION}_checksums.txt"
          grep " ${archive}$" trivy-checksums.txt | sha256sum -c -
          tar -xzf "$archive" trivy
      - name: Vulnérabilités corrigeables HIGH/CRITICAL (bloquant)
        run: |
          for img in api web; do
            ./trivy image --quiet --severity HIGH,CRITICAL --ignore-unfixed --scanners vuln --exit-code 1 "avocat-expert/$img:dev"
          done
      - name: Nomenclatures logicielles (CycloneDX)
        run: |
          mkdir -p sbom
          for img in api web; do ./trivy image --quiet --format cyclonedx --output "sbom/$img.cdx.json" "avocat-expert/$img:dev"; done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom/
      - name: Modèle d'embeddings (cache)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.avx-models/multilingual-e5-base@d1287505
          key: embedding-multilingual-e5-base@d1287505
      - name: Modèle d'embeddings (téléchargement par l'image si absent, empreintes vérifiées)
        run: |
          dir="$GITHUB_WORKSPACE/.avx-models/multilingual-e5-base@d1287505"
          mkdir -p "$dir"
          docker run --rm --user "$(id -u):$(id -g)" -v "$dir:/m" --entrypoint avx avocat-expert/api:dev \
            telecharger-modele --modele multilingual-e5-base@d1287505 --dossier /m
      - name: Test de fumée de la pile (ingestion, vecteurs, API, web, Keycloak)
        run: AVX_SMOKE_MODEL_DIR="$GITHUB_WORKSPACE/.avx-models" scripts/smoke-compose.sh --no-build

  secrets:
    name: Détection de secrets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL -o "$archive" "$base/$archive"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${archive}$" checksums.txt | sha256sum -c -
          tar -xzf "$archive" gitleaks
          ./gitleaks git --redact --exit-code 1 .
